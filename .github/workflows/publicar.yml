name: Publicar Visor Albiol
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/procesar.js'
      - 'src/publicar.js'
      - 'data/posts/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: visor-albiol-pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar estructura sin acceso a X
        run: npm test
      - name: Comprobar sintaxis del frontend
        run: node --check web/app.js
      - name: Recalcular estadísticas sobre histórico (sin API de X)
        run: npm run process
      - name: Construir sitio estático
        run: npm run site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir sitio web
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
